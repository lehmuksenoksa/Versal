<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Versal Ink Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500&family=EB+Garamond:wght@400;500&family=IM+Fell+English&family=Spectral:wght@400&family=Crimson+Pro:wght@400&display=swap">
<style>
  /* Layout: the Versal mockup sheet. A live game screen (desktop) and the same state on a phone,
     driven by the game's own keys (e, i, l, m) or the buttons; the switches below try the open
     questions; what each part is for is written under it. */
  @font-face { font-family: "Texturina"; font-weight: 100 900; src: url("../fonts/Texturina-Latin.woff2") format("woff2"); }
  @font-face { font-family: "IM Fell Italic"; font-style: italic; src: url("../fonts/IMFellEnglish-Italic.woff2") format("woff2"); }
  :root {
    --desk: #e6dfcf;
    --paper: #f7f2e6;
    --ink: #1b1815;
    --muted: #6b5f52;
    --rule: #cfc5b0;
    --accent: #8c2b1c;
    /* The ledger: black, light text, the map's lettering. */
    --gui: #0e0d0c;
    --gui-line: #3a3632;
    --gui-text: #ddd6c6;
    --gui-dim: #8f877a;
    --gui-faint: #5d574f;
    --blood: #c4402e;
    --warn: #d9a53a;
    --poison: #8aa13a;
    --body: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --letter: Texturina, Georgia, serif;
    --hand: "IM Fell Italic", Georgia, serif;
    /* The log's face: chosen with the switch. */
    --log: "Crimson Pro", Georgia, serif;
    --log-style: normal;
    --log-size: 19px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--desk);
    color: var(--ink);
    font: 15px/1.45 var(--body);
    padding-block: 20px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1 { margin: 0 0 4px; font-size: 26px; font-weight: normal; text-wrap: balance; }
  h2 { margin: 0 0 6px; font-size: 19px; font-weight: normal; text-wrap: balance; }
  p { margin: 0 0 10px; max-width: 72ch; color: var(--muted); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin: 12px 0; font-size: 14px; color: var(--muted); }
  .bar > span { margin-right: 2px; }
  .bar button {
    font: 14px var(--body); color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); padding: 5px 10px; cursor: pointer;
  }
  .bar button kbd { font: bold 13px var(--body); margin-right: 5px; }
  .bar button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
  button:focus-visible, select:focus-visible, .screen:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 4px 0 14px; font-size: 14px; color: var(--muted); }
  .opts label { display: flex; align-items: center; gap: 6px; }
  select { font: 14px var(--body); padding: 2px 4px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
  /* Controls in a column beside the screens, so both fit on one screen. */
  .work { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
  .ctl { position: sticky; top: 8px; max-height: calc(100vh - 16px); overflow: auto; display: grid; gap: 10px; min-width: 0; }
  .ctl .bar, .ctl .opts { margin: 0; }
  .screens { min-width: 0; }
  .sheet { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 210px); gap: 12px; align-items: start; }
  @media (max-width: 900px) { .work { grid-template-columns: minmax(0, 1fr); } .ctl { position: static; max-height: none; } }
  @media (max-width: 760px) { .sheet { grid-template-columns: minmax(0, 1fr); } .sheet .phonebox { max-width: 250px; } }
  .frame { background: var(--paper); border: 1px solid var(--rule); padding: 8px; min-width: 0; }
  .fit { position: relative; width: 100%; overflow: hidden; background: #000; }
  .fit.desk { aspect-ratio: 1280 / 800; }
  .fit.phone { aspect-ratio: 390 / 800; }
  .screen { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: #000; color: var(--gui-text); font-family: var(--body); }
  .desk .screen { width: 1280px; height: 800px; }
  .phone .screen { width: 390px; height: 800px; }
  .label { font-size: 13px; color: var(--muted); padding: 6px 2px 0; }
  .gen { background: var(--paper); border: 1px solid var(--rule); padding: 10px 12px; display: grid; gap: 8px; }
  .gen h2 { margin: 0; }
  .gen p { margin: 0; }
  .gencols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .gencols > div { min-width: 0; display: grid; gap: 6px; align-content: start; }
  .gencols h3 { margin: 0; font-size: 16px; font-weight: normal; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .gen label.sl { display: grid; grid-template-columns: 8.5em minmax(0, 1fr) 3.4em; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
  .gen label.sl output { font-variant-numeric: tabular-nums; color: var(--ink); text-align: right; }
  .gen input[type="range"] { width: 100%; min-width: 0; accent-color: var(--accent); }
  .gen input[type="number"] { width: 7em; font: 14px var(--body); padding: 2px 4px; border: 1px solid var(--rule); background: #fff; }
  .gen button { font: 14px var(--body); color: var(--ink); background: #fff; border: 1px solid var(--rule); padding: 4px 10px; cursor: pointer; }
  .gen button.main { border-color: var(--ink); }
  .gen textarea { width: 100%; min-height: 3.5em; font: 12px/1.4 ui-monospace, Menlo, monospace; border: 1px solid var(--rule); background: #fff; color: var(--ink); padding: 6px; resize: vertical; }
  .genrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .saved { display: flex; flex-wrap: wrap; gap: 6px; }
  .saved button { font-size: 13px; }
  .msg { font-size: 13px; color: var(--muted); }
  .notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px 28px; margin-top: 18px; }
  .notes > div { min-width: 0; }
  .notes p { margin: 0; }

  /* ---- The game screen ---- */
  .map { position: absolute; inset: 0; background: #000 center / cover no-repeat; }
  .g { font-family: var(--letter); font-weight: 700; }
  /* Text straight on the hatching: outlined in black, as the letters are outlined, instead of
     sitting on a fade. */
  .onmap { paint-order: stroke fill; -webkit-text-stroke: 6px var(--gui); }

  /* The top of the map: the place, the level, the newest messages. */
  .top { position: absolute; left: 0; top: 0; padding: 18px 26px; pointer-events: none; }
  .head { display: flex; align-items: baseline; gap: 14px; }
  .place { font: 600 28px/1.1 var(--letter); letter-spacing: 0.02em; }
  .depth { font: 600 17px var(--letter); color: var(--gui-dim); }
  .desk .top .news { max-width: var(--msgw); }
  .news { margin-top: 8px; font-family: var(--log); font-style: var(--log-style); font-size: var(--log-size); line-height: 1.35; display: grid; gap: 1px; }
  .news div:nth-last-child(2) { color: #b3ab9c; }
  .news div:nth-last-child(3) { color: #8a8274; }
  .news .pull { font: 600 13px var(--letter); color: var(--gui-faint); margin-top: 4px; letter-spacing: 0.04em; }

  /* The drawer of messages, pulled down over the map. */
  .drawer { position: absolute; left: 0; top: 0; height: 520px; background: #000; padding: 18px 26px; transform: translateY(calc(-100% - 80px)); transition: transform 0.25s ease; display: grid; grid-template-rows: auto 1fr auto; gap: 10px; }
  .drawer.open { transform: none; }
  /* The drawer's torn foot, hanging below it. */
  .drawer .foot { position: absolute; left: 0; top: calc(100% - 2px); width: 100%; height: 70px; pointer-events: none; }
  .drawer ol { list-style: none; margin: 0; padding: 0; overflow: auto; display: grid; gap: 3px; align-content: end; font-family: var(--log); font-style: var(--log-style); font-size: var(--log-size); line-height: 1.35; color: var(--gui-dim); }
  .drawer li.turn { font: 600 12px var(--letter); letter-spacing: 0.12em; text-transform: uppercase; color: var(--gui-faint); margin-top: 8px; }
  .drawer li.new { color: var(--gui-text); }
  .drawer li.you { color: var(--blood); }
  .drawer .hint { font: 600 13px var(--letter); color: var(--gui-faint); }

  /* The sidebar: always there. On top, who you are and your health; under it, your sheet, or
     what you've opened. */
  /* (Black as the unexplored ground around the map, with no edge: the map simply ends in it.) */
  .side { position: absolute; right: 0; top: 0; bottom: 0; width: 340px; background: #000; padding: 22px 26px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 18px; }
  .who h3 { margin: 0; font: 600 26px/1.1 var(--letter); }
  .who div { font: 600 15px var(--letter); color: var(--gui-dim); margin-top: 2px; }
  h5 { margin: 0 0 6px; font: 600 13px var(--letter); letter-spacing: 0.12em; text-transform: uppercase; color: var(--gui-dim); display: flex; justify-content: space-between; }
  h5 small { font: 600 12px var(--letter); letter-spacing: 0.04em; text-transform: none; color: var(--gui-faint); }
  .hp { font: 600 34px/1 var(--letter); font-variant-numeric: tabular-nums; }
  .hp span { font-size: 22px; color: var(--gui-dim); }
  .hp.low { color: var(--blood); }
  .statuses { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font: 600 15px var(--letter); }
  .statuses .bleeding { color: var(--blood); }
  .statuses .poisoned { color: var(--poison); }
  .statuses .none { color: var(--gui-faint); font-weight: 400; }
  .body { border-top: 1px solid var(--gui-line); padding-top: 16px; display: grid; gap: 18px; align-content: start; min-height: 0; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; }
  .panel-head h4 { margin: 0; font: 600 22px var(--letter); }
  .panel-head small { font: 600 12px var(--letter); color: var(--gui-faint); }
  .ledger { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 16px; }
  .ledger li { display: grid; grid-template-columns: 16px 22px auto 1fr auto; gap: 6px; align-items: baseline; }
  .ledger.plain li { grid-template-columns: auto 1fr auto; }
  .ledger li .key { font: 600 13px var(--letter); color: var(--gui-faint); }
  .ledger li .g { font-size: 19px; text-align: center; }
  .ledger li .lead { border-bottom: 1px dotted var(--gui-line); transform: translateY(-4px); }
  .ledger li .val { font: 15px var(--body); color: var(--gui-dim); font-variant-numeric: tabular-nums; }
  .ledger li b.val { font: 600 17px var(--letter); color: var(--gui-text); }
  .ledger li.none { color: var(--gui-faint); font-style: italic; }
  .ledger li.none .g { color: var(--gui-faint); }
  .xp { font: 600 20px var(--letter); font-variant-numeric: tabular-nums; }
  .xp span { color: var(--gui-dim); font-size: 16px; }
  .xpline { height: 2px; background: var(--gui-line); margin-top: 6px; }
  .xpline i { display: block; height: 100%; background: var(--gui-dim); }
  .st { font: 600 14px var(--letter); }
  .st.alarmed { color: var(--blood); }
  .st.suspicious { color: var(--warn); }
  .sum { font-size: 15px; color: var(--gui-dim); }
  .sum b { font: 600 16px var(--letter); color: var(--gui-text); }
  .keys-help { border-top: 1px solid var(--gui-line); padding-top: 10px; display: flex; flex-wrap: wrap; gap: 4px 14px; font: 13px var(--body); color: var(--gui-faint); }
  .keys-help b { font: 600 13px var(--letter); color: var(--gui-dim); }
  .keys-help .on b, .keys-help .on { color: var(--gui-text); }
  .marks { position: absolute; pointer-events: none; }
  .plates { position: absolute; inset: 0; width: 1280px; height: 800px; pointer-events: none; }
  .desk .side { background: transparent; }
  .marks span { position: absolute; font: 700 26px var(--letter); transform: translate(-50%, -100%); }

  /* Phone: no room for the sidebar; the top carries your health, the rest opens as a sheet. */
  .phone .top { padding: 12px 14px; right: 0; }
  .phone .place { font-size: 20px; }
  .phone .depth { font-size: 14px; }
  .phone .hpline { margin-left: auto; font: 600 17px var(--letter); }
  .phone .hpline span { color: var(--gui-dim); font-size: 13px; }
  .phone .news { font-size: 15px; margin-top: 4px; }
  .phone .side { left: 0; top: auto; width: auto; height: 380px; bottom: 56px; border-left: 0; border-top: 2px solid var(--gui-text); padding: 14px 18px; transform: translateY(102%); transition: transform 0.25s ease; grid-template-rows: auto 1fr; gap: 12px; }
  .phone .side.open { transform: none; }
  .phone .ledger { font-size: 14px; }
  .phone .drawer { right: 0; height: 470px; padding: 14px; }
  .phone .drawer ol { font-size: 15px; }
  .phone .keys { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: var(--gui); border-top: 1px solid var(--gui-line); display: grid; grid-template-columns: repeat(5, 1fr); }
  .phone .keys div { display: grid; place-items: center; font: 600 13px var(--letter); color: var(--gui-dim); }
  .phone .keys div.on { color: var(--gui-text); box-shadow: inset 0 2px 0 var(--gui-text); }
</style>
</head>
<body>

<header><h1>The ink ledger</h1></header>

<div class="work">
<aside class="ctl">
<div class="bar" role="group" aria-label="Open">
  <span>Open:</span>
  <button type="button" id="open-none" data-open="none"><kbd>Esc</kbd>Your sheet</button>
  <button type="button" id="open-e" data-open="e"><kbd>e</kbd>Equipment</button>
  <button type="button" id="open-i" data-open="i"><kbd>i</kbd>Inventory</button>
  <button type="button" id="open-l" data-open="l"><kbd>l</kbd>Look</button>
  <button type="button" id="open-m" data-open="m"><kbd>m</kbd>Messages</button>
</div>

<div class="opts">
  <label>The log in <select id="opt-log">
    <option value="crimson">Crimson Pro</option>
    <option value="alegreya">Alegreya</option>
    <option value="garamond">EB Garamond</option>
    <option value="fell">IM Fell, upright</option>
    <option value="spectral">Spectral</option>
    <option value="texturina">Texturina, as the letters</option>
    <option value="fellitalic">IM Fell italic, as before</option>
  </select></label>
  <label>Ailing <select id="opt-status">
    <option value="two">bleeding and poisoned</option>
    <option value="one">bleeding</option>
    <option value="none">nothing</option>
  </select></label>
  <label>Health <select id="opt-hp">
    <option value="11">11 of 23</option>
    <option value="6">6 of 23 (low)</option>
    <option value="23">23 of 23</option>
  </select></label>
  <label>Look marks the map <select id="opt-marks">
    <option value="on">with ! and ? over letters</option>
    <option value="off">no</option>
  </select></label>
</div>

<section class="gen" aria-labelledby="gen-title">
  <h2 id="gen-title">The torn plates</h2>
  <div class="genrow">
    <label><input type="checkbox" id="gen-showspace"> Show and edit the black areas</label>
    <label>Messages <select id="gen-sample"><option value="short">as now</option><option value="long">long, to test the space</option></select></label>
  </div>
  <div class="gencols">
    <div id="gen-corner"></div>
    <div id="gen-side"></div>
  </div>
  <div class="genrow"><button type="button" class="main" id="gen-both">New shapes for both</button><button type="button" id="gen-copy">Copy</button><button type="button" id="gen-save">Save</button><button type="button" id="gen-reset">Reset the black areas</button><span class="msg" id="gen-msg" role="status"></span></div>
  <textarea id="gen-out" readonly aria-label="The shapes, as text to copy"></textarea>
  <div class="saved" id="gen-saved"></div>
</section>
</aside>
<div class="screens">
<div class="sheet">
  <div class="frame"><div class="fit desk"><div class="screen" id="desk" tabindex="0" aria-label="Game screen: press e, i, l or m"></div></div><div class="label">Desktop, 1280 by 800</div></div>
  <div class="frame phonebox"><div class="fit phone"><div class="screen" id="phone"></div></div><div class="label">Phone, 390 wide</div></div>
</div>

</div>
</div>


<script>
// The moment shown, made up for the milestones to come.
const RUN = {
  name: "Edda", cls: "Grave robber", level: 3, xp: 140, next: 200,
  place: "The old crypts", depth: "1st level", max: 23,
  stats: [["Attack", "1–4"], ["Defence", "2"], ["Speed", "normal"]],
  equip: [
    { where: "hand", g: ")", n: "dagger", v: "attack 1–4" },
    { where: "off hand", none: true },
    { where: "head", g: "[", n: "leather helmet", v: "defence 1" },
    { where: "body", g: "[", n: "padded jerkin", v: "defence 1" },
  ],
  inv: [
    { k: "a", g: "!", n: "potion of healing", v: "2" },
    { k: "b", g: ")", n: "short sword", v: "attack 2–5" },
    { k: "c", g: ")", n: "warhammer", v: "attack 3–7" },
  ],
  near: [
    { g: "z", n: "skeleton", st: "alarmed" },
    { g: "z", n: "skeleton", st: "suspicious" },
  ],
  things: [{ g: "∴", n: "rubble" }, { g: "▯", n: "a way on, north" }],
  log: [
    { turn: "Turn 398" },
    { t: "You go down into the old crypts." },
    { t: "You hear a clatter to the west." },
    { turn: "Turn 405" },
    { t: "You open the door." },
    { t: "Two skeletons stand in the room." },
    { t: "One of them turns its head." },
    { turn: "Turn 410" },
    { t: "A skeleton rises." },
    { t: "You hit the skeleton." },
    { t: "The skeleton claws you. (3) You bleed.", you: true },
  ],
};
const LOGFACE = {
  alegreya: ["Alegreya, Georgia, serif", "normal", "18px"],
  garamond: ['"EB Garamond", Georgia, serif', "normal", "19px"],
  fell: ['"IM Fell English", Georgia, serif', "normal", "18px"],
  spectral: ["Spectral, Georgia, serif", "normal", "17px"],
  crimson: ['"Crimson Pro", Georgia, serif', "normal", "19px"],
  texturina: ["Texturina, Georgia, serif", "normal", "16px"],
  fellitalic: ['"IM Fell Italic", Georgia, serif', "italic", "18px"],
};
const OPEN_NAMES = { e: "Equipment", i: "Inventory", l: "Look", m: "Messages" };
const $ = (id) => document.getElementById(id);
const g = (c) => `<span class="g">${c}</span>`;
const state = { open: "none" };
const opt = (id) => $(`opt-${id}`).value;

function statuses() {
  const s = { two: ["bleeding", "poisoned"], one: ["bleeding"], none: [] }[opt("status")];
  return s.length ? s.map((w) => `<span class="${w}">${w}</span>`).join("") : `<span class="none">nothing ails you</span>`;
}

function panel() {
  const o = state.open;
  if (o === "e") {
    return `<div class="panel-head"><h4>Equipment</h4><small>e to close</small></div>
      <ul class="ledger">${RUN.equip.map((q) => q.none
        ? `<li class="none"><span></span>${g("·")}<span>${q.where}: nothing</span><span></span><span></span></li>`
        : `<li><span></span>${g(q.g)}<span>${q.n}</span><span class="lead"></span><span class="val">${q.v}</span></li>`).join("")}</ul>
      <div class="sum">Altogether: attack <b>1–4</b>, defence <b>2</b>.</div>`;
  }
  if (o === "i") {
    return `<div class="panel-head"><h4>Inventory</h4><small>i to close</small></div>
      <ul class="ledger">${RUN.inv.map((q) => `<li><span class="key">${q.k}</span>${g(q.g)}<span>${q.n}</span><span class="lead"></span><span class="val">${q.v}</span></li>`).join("")}</ul>
      <div class="sum">Room for <b>5</b> more things.</div>`;
  }
  if (o === "l") {
    return `<div class="panel-head"><h4>In sight</h4><small>l to close</small></div>
      <div><h5>Creatures</h5><ul class="ledger">${RUN.near.map((n) => `<li><span></span>${g(n.g)}<span>${n.n}</span><span class="lead"></span><span class="st ${n.st}">${n.st}</span></li>`).join("")}</ul></div>
      <div><h5>Things</h5><ul class="ledger">${RUN.things.map((t) => `<li><span></span><span class="g" style="font-size:15px;color:var(--gui-dim)">${t.g}</span><span>${t.n}</span><span></span><span></span></li>`).join("")}</ul></div>
      <div class="sum">You are <b>seen</b>; your lamp is lit.</div>`;
  }
  // Your sheet.
  return `<div><h5>Experience<small>to the ${RUN.level + 1}th level</small></h5>
      <div class="xp">${RUN.xp}<span> / ${RUN.next}</span></div>
      <div class="xpline"><i style="width:${(100 * RUN.xp) / RUN.next}%"></i></div></div>
    <div><h5>Stats</h5><ul class="ledger plain">${RUN.stats.map(([k, v]) => `<li><span>${k}</span><span class="lead"></span><b class="val">${v}</b></li>`).join("")}</ul></div>`;
}

function drawer() {
  return `<h5>Messages, ${RUN.place.toLowerCase()}</h5>
    <ol>${RUN.log.map((l, i) => l.turn ? `<li class="turn">${l.turn}</li>` : `<li class="${l.you ? "you" : i === RUN.log.length - 1 ? "new" : ""}">${l.t}</li>`).join("")}</ol>
    <div class="hint">m or Esc to push it back up</div>
    <canvas class="foot"></canvas>`;
}

function render() {
  const o = state.open, side = o === "e" || o === "i" || o === "l";
  const [face, style, size] = LOGFACE[opt("log")];
  document.documentElement.style.setProperty("--log", face);
  document.documentElement.style.setProperty("--log-style", style);
  document.documentElement.style.setProperty("--log-size", size);

// ---- The torn plates ----
// Each plate: a fully black area, and a band round it in which its edge is drawn, as cave walls
// are (points along the band's middle, each moved about in the band, some dropped), then torn
// (the first tear tried). All from a seed and a few numbers, so a shape can be made again.
const SIDE_CORE = 952;
const PARAMS = {
  corner: [
    ["band", "Band", 10, 140, 1, "px"],
    ["chars", "Message width", 24, 64, 1, " ch"],
    ["step", "Point spacing", 8, 120, 1, "px"],
    ["jitter", "Wander in the band", 0, 1, 0.01, ""],
    ["cut", "Corners cut", 0, 0.7, 0.01, ""],
    ["tear", "Tear", 0, 2, 0.05, ""],
  ],
  side: [
    ["band", "Band", 10, 100, 1, "px"],
    ["step", "Point spacing", 8, 160, 1, "px"],
    ["jitter", "Wander in the band", 0, 1, 0.01, ""],
    ["cut", "Corners cut", 0, 0.7, 0.01, ""],
    ["tear", "Tear", 0, 2, 0.05, ""],
  ],
};
const GEN = {
  // (The shapes chosen, saved in mockups/ledger/plates.json.)
  corner: { seed: 81016, band: 33, chars: 42, skew: 24, step: 30, jitter: 0.9, cut: 0.55, tear: 1.4 },
  side: { seed: 273917, band: 34, skew: 40, step: 89, jitter: 1, cut: 0.55, tear: 1.55 },

const mulberry = (a) => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

// The space kept at the top left, as three boxes from the top: the heading (wide enough for the
// longest), the messages (their width in characters of the log's face), "m for more".
let SPACE = { w: 460, h: 170, lh: 25.65, msgPx: 340, rects: [] };
function keptSpace() {
  const root = getComputedStyle(document.documentElement);
  const size = parseFloat(root.getPropertyValue("--log-size")) || 19, face = root.getPropertyValue("--log") || "Georgia";
  const c = (keptSpace.c ??= document.createElement("canvas").getContext("2d"));
  c.font = `${size}px ${face}`;
  const text = "The skeleton claws you. (3) You hear a clatter to the west.";
  const ch = c.measureText(text).width / text.length, lh = size * 1.35, pad = 26;
  c.font = "600 28px Texturina, Georgia, serif";
  const longest = "The halls of the goblin king";
  let head = c.measureText(longest).width + longest.length * 0.02 * 28 + 14 + 8;
  c.font = "600 17px Texturina, Georgia, serif";
  head += c.measureText("3rd level").width;
  c.font = "600 13px Texturina, Georgia, serif";
  const pull = c.measureText("m for more").width + 10 * 0.04 * 13;
  const msgPx = Math.round(GEN.corner.chars * ch);
  const r1 = [0, 0, Math.round(pad + head + 10), 54];
  const r2 = [0, r1[3], Math.round(pad + msgPx + 12), Math.round(r1[3] + 8 + 3 * lh + 2)];
  const r3 = [0, r2[3], Math.round(pad + pull + 12), r2[3] + 30];
  return { rects: [r1, r2, r3], w: Math.max(r1[2], r2[2], r3[2]), h: r3[3], lh, msgPx };
}

// The black areas' edges, as polylines edited with the mouse: the corner's from the top edge of
// the screen round to its left edge (the black area on the right of the way along, towards the
// top left corner); the sidebar's from the bottom of the screen to the top (the black on the
// right, towards the right edge). Made at first from the boxes kept for the text, leaning.
const CHOSEN_AREAS = {"corner":[[644,0],[552,56],[460,79],[364,154],[163,159],[77,191],[0,181]],"side":[[952,800],[942,728],[950,660],[955,565],[948,506],[936,339],[942,200],[933,165],[932,96],[920,48],[924,0]]};
let AREAS = JSON.parse(JSON.stringify(CHOSEN_AREAS));
const LEAN = 24, SIDE_LEAN = 40;
function defaultAreas() {
  const rightAt = (r, y) => r[2] + LEAN * (r[3] - y) / (r[3] - r[1]);
  const R = SPACE.rects, corner = [[rightAt(R[0], 0), 0]];
  R.forEach((r, i) => {
    const next = R[i + 1];
    corner.push([rightAt(r, r[3]), r[3]]);
    if (next) corner.push([rightAt(next, r[3]), r[3]]);
  });
  corner.push([0, R[R.length - 1][3]]);
  return { corner, side: [[SIDE_CORE, 800], [SIDE_CORE - SIDE_LEAN, 0]] };
}
// The polyline carried off the screen at both ends, and the black area it bounds.
function extended(name) {
  const a = AREAS[name], f = a[0], l = a[a.length - 1];
  return name === "corner" ? [[f[0], -30], ...a, [-30, l[1]]] : [[f[0], 830], ...a, [l[0], -30]];
}
function blackArea(name) {
  return name === "corner" ? [...extended(name), [-30, -30]] : [...extended(name), [1300, -30], [1300, 830]];
}
// A polyline moved `d` to the left of the way along it (out of the black), mitred.
function offsetPoly(pts, d) {
  const n = pts.map((p, i) => {
    const q = pts[Math.min(i + 1, pts.length - 1)], o = pts[Math.max(i - 1, 0)];
    const seg = (a, b) => { const L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1; return [(b[1] - a[1]) / L, -(b[0] - a[0]) / L]; };
    const n1 = i > 0 ? seg(o, p) : seg(p, q), n2 = i < pts.length - 1 ? seg(p, q) : n1;
    let mx = n1[0] + n2[0], my = n1[1] + n2[1];
    const L = Math.hypot(mx, my) || 1; mx /= L; my /= L;
    const k = Math.min(3, 1 / Math.max(0.33, mx * n2[0] + my * n2[1]));
    return [p[0] + mx * d * k, p[1] + my * d * k];
  });

}
const insidePoly = (poly, x, y) => {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }

};
// The nearest point on a polyline, and how far, and which piece.
function nearestOn(pts, x, y) {
  let best = null;
  for (let i = 0; i < pts.length - 1; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[i + 1], dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1;
    const t = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / L2)), px = ax + dx * t, py = ay + dy * t;
    const d = Math.hypot(x - px, y - py);
    if (!best || d < best.d) best = { x: px, y: py, d, i };
  }
  return best;
}

// Points along a line every `step` (give or take), each moved across the band (and a little
// along), some dropped: the cave walls' way. Off the screen they stay put.
function caveLine(line, P, rnd) {
  const out = [line[0]];
  let dropped = false;
  for (let i = 0; i < line.length - 1; i++) {
    const [ax, ay] = line[i], [bx, by] = line[i + 1], L = Math.hypot(bx - ax, by - ay);
    if (L < 0.01) continue;
    const tx = (bx - ax) / L, ty = (by - ay) / L;
    for (let d = P.step * (0.4 + rnd() * 0.6); d < L; d += P.step * (0.6 + rnd() * 0.8)) {
      const x = ax + tx * d, y = ay + ty * d;
      if (offscreen(x, y)) { out.push([x, y]); continue; }
      if (!dropped && rnd() < P.cut) { dropped = true; continue; }
      dropped = false;
      const across = (rnd() * 2 - 1) * P.jitter * P.band / 2, along = (rnd() - 0.5) * P.step * 0.3;
      out.push([x + tx * along + ty * across, y + ty * along - tx * across]);
    }
    out.push([bx, by]);
  }
  return out;
}

// Keeping a point in its band: out of the black area, and no further than the band.
function keepInBand(name, P, x, y) {
  if (offscreen(x, y)) return [x, y];
  const near = nearestOn(extended(name), x, y);
  if (insidePoly(blackArea(name), x, y)) return [near.x, near.y];
  if (near.d > P.band) { const k = P.band / near.d; return [near.x + (x - near.x) * k, near.y + (y - near.y) * k]; }
  return [x, y];
}

function plateShapes() {
  const C = GEN.corner, S = GEN.side;
  const corner = caveLine(offsetPoly(extended("corner"), C.band / 2), C, mulberry(C.seed * 7919 + 13));
  const side = caveLine(offsetPoly(extended("side"), S.band / 2), S, mulberry(S.seed * 7919 + 29));
  return { corner: [...corner, [-30, -30]], side: [...side, [1300, -30], [1300, 830]] };
}

let lastShapes = null;
function drawPlates(c) {
  const g = c.getContext("2d");
  g.setTransform(2, 0, 0, 2, 0, 0);
  g.clearRect(0, 0, 1280, 800);
  g.fillStyle = "#000";
  AREAS ??= defaultAreas();
  const shapes = (lastShapes = plateShapes());
  for (const [name, pts] of Object.entries(shapes)) {
    const P = GEN[name], rnd = mulberry(P.seed * 31 + 7);
    const waves = (n, f0, f1) => Array.from({ length: n }, () => [f0 + rnd() * (f1 - f0), rnd() * 6.28, 0.5 + rnd()]);
    const SLOW = waves(4, 0.008, 0.03), QUICK = waves(5, 0.08, 0.22);
    const noise = (t, w) => w.reduce((s, [f, p, a]) => s + a * Math.sin(t * f + p), 0) / w.reduce((s, [, , a]) => s + a, 0);
    // Round the outline every 3px, torn (none off the screen), kept in the band.
    g.beginPath();
    let t = 0, first = true;
    for (let i = 0; i < pts.length; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length], L = Math.hypot(bx - ax, by - ay);
      if (L < 0.01) continue;
      const tx = (bx - ax) / L, ty = (by - ay) / L;
      for (let d = 0; d < L; d += 3, t += 3) {
        const x = ax + tx * d, y = ay + ty * d, on = !offscreen(x, y);
        const k = on ? P.tear * (7 * noise(t, SLOW) + 2.2 * noise(t, QUICK) + (rnd() - 0.5) * 2.4) : 0;
        const [px, py] = keepInBand(name, P, x - ty * k, y + tx * k);
        g[first ? "moveTo" : "lineTo"](px, py);
        first = false;
      }
    }
    g.closePath();
    g.fill();
  }
  // The black areas' edges (dashed, with their points to drag) and the bands' outer edges (dotted).
  if ($("gen-showspace")?.checked) {
    const path = (pts) => { g.beginPath(); pts.forEach(([x, y], i) => g[i ? "lineTo" : "moveTo"](x, y)); g.stroke(); };
    g.save();
    g.lineWidth = 1;
    for (const name of ["corner", "side"]) {
      g.strokeStyle = "rgba(221, 214, 198, 0.4)";
      g.setLineDash([2, 4]);
      path(offsetPoly(extended(name), GEN[name].band));
      g.strokeStyle = "rgba(221, 214, 198, 0.75)";
      g.setLineDash([6, 5]);
      path(AREAS[name]);
      g.setLineDash([]);
      for (const [x, y] of AREAS[name]) {
        g.beginPath(); g.arc(x, y, 6, 0, 6.29);
        g.fillStyle = "#f7f2e6"; g.fill();
        g.strokeStyle = "#8c2b1c"; g.lineWidth = 2; g.stroke(); g.lineWidth = 1;
      }
    }
    g.restore();
  }
  writeOut();
}

// The drawer's foot: torn as the plates are, in a band under the drawer (as the corner's edge).
function drawerFoot(c) {
  const W = c.parentElement.offsetWidth, H = 70, P = { ...GEN.corner, seed: GEN.corner.seed + 101 }, B = P.band;
  c.width = W * 2; c.height = H * 2;
  const g = c.getContext("2d");
  g.setTransform(2, 0, 0, 2, 0, 0);
  g.fillStyle = "#000";
  // The way along: right to left, the drawer above (on its right); points moved about in the band.
  const pts = caveLine([[W + 30, B / 2], [-30, B / 2]], P, mulberry(P.seed * 7919 + 13));
  const rnd = mulberry(P.seed * 31 + 7);
  const waves = (n, f0, f1) => Array.from({ length: n }, () => [f0 + rnd() * (f1 - f0), rnd() * 6.28, 0.5 + rnd()]);
  const SLOW = waves(4, 0.008, 0.03), QUICK = waves(5, 0.08, 0.22);
  const noise = (t, w) => w.reduce((s, [f, p, a]) => s + a * Math.sin(t * f + p), 0) / w.reduce((s, [, , a]) => s + a, 0);
  g.beginPath();
  let t = 0, first = true;
  for (let i = 0; i < pts.length - 1; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[i + 1], L = Math.hypot(bx - ax, by - ay);
    if (L < 0.01) continue;
    const tx = (bx - ax) / L, ty = (by - ay) / L;
    for (let d = 0; d < L; d += 3, t += 3) {
      const x = ax + tx * d, y = ay + ty * d, k = P.tear * (7 * noise(t, SLOW) + 2.2 * noise(t, QUICK) + (rnd() - 0.5) * 2.4);
      g[first ? "moveTo" : "lineTo"](x - ty * k, Math.max(0, Math.min(B, y + tx * k)));
      first = false;
    }

// ---- The generator's controls ----
function genControls() {

      ${PARAMS[name].map(([k, label, min, max, step, unit]) => `<label class="sl"><span>${label}</span><input type="range" id="${name}-${k}" min="${min}" max="${max}" step="${step}" value="${P[k]}"><output id="${name}-${k}-v">${P[k]}${unit}</output></label>`).join("")}`;
    $(`new-${name}`).addEventListener("click", () => { P.seed = Math.floor(Math.random() * 1e6); $(`seed-${name}`).value = P.seed; render(); });
    $(`seed-${name}`).addEventListener("input", (e) => { P.seed = +e.target.value || 0; render(); });

function genSync() {

    for (const [k, , , , , unit] of PARAMS[name]) { $(`${name}-${k}`).value = P[k]; $(`${name}-${k}-v`).textContent = `${P[k]}${unit}`; }

// The text to send: the numbers that make the shapes, and the outlines themselves (before tearing).
function writeOut() {

  $("gen-out").value = JSON.stringify({ plates: GEN, areas: { corner: pts(AREAS.corner), side: pts(AREAS.side) }, outline: { corner: pts(lastShapes.corner), side: pts(lastShapes.side) } });
}
const SAVE_KEY = "versal-plates";
const loadSaved = () => { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || "[]"); } catch { return []; } };
function showSaved() {

genControls();
$("gen-showspace").addEventListener("input", render);
$("gen-sample").addEventListener("input", render);
$("gen-both").addEventListener("click", () => { GEN.corner.seed = Math.floor(Math.random() * 1e6); GEN.side.seed = Math.floor(Math.random() * 1e6); genSync(); render(); });

});

  list.push(JSON.parse(JSON.stringify({ gen: GEN, areas: AREAS })));
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(list)); $("gen-msg").textContent = "Saved on this page, in this browser."; } catch { $("gen-msg").textContent = "This browser won't keep it: copy the text instead."; }

showSaved();
$("gen-reset").addEventListener("click", () => { AREAS = defaultAreas(); redrawPlates(); });

// Editing the black areas' edges with the mouse, on the desktop screen: drag a point (the end
// points slide along the screen's edge); double-click the line to add a point, a point to take
// it away.
function redrawPlates() { const c = $("desk").querySelector(".plates"); if (c) drawPlates(c); }
function screenAt(e) {
  const r = $("desk").getBoundingClientRect();

}
function handleAt(x, y) {
  let best = null;
  for (const name of ["corner", "side"]) AREAS[name].forEach(([px, py], i) => {
    const d = Math.hypot(px - x, py - y);

}
let drag = null;
$("desk").addEventListener("pointerdown", (e) => {

  $("desk").setPointerCapture(e.pointerId);
  e.preventDefault();
});
$("desk").addEventListener("pointermove", (e) => {
  const [x0, y0] = screenAt(e);
  if (!drag) { if ($("gen-showspace").checked && AREAS) $("desk").style.cursor = handleAt(x0, y0) ? "grab" : ""; return; }
  const a = AREAS[drag.name], last = drag.i === a.length - 1;
  let x = Math.max(0, Math.min(1280, x0)), y = Math.max(0, Math.min(800, y0));
  if (drag.name === "corner") { if (drag.i === 0) y = 0; if (last) x = 0; }
  else { if (drag.i === 0) y = 800; if (last) y = 0; }
  a[drag.i] = [x, y];
  $("desk").style.cursor = "grabbing";
  redrawPlates();
});
const endDrag = () => { drag = null; $("desk").style.cursor = ""; };
$("desk").addEventListener("pointerup", endDrag);
$("desk").addEventListener("pointercancel", endDrag);
$("desk").addEventListener("dblclick", (e) => {
  if (!$("gen-showspace").checked || !AREAS) return;
  const [x, y] = screenAt(e), h = handleAt(x, y);
  if (h) {
    if (h.i > 0 && h.i < AREAS[h.name].length - 1) AREAS[h.name].splice(h.i, 1);
  } else {
    let best = null;
    for (const name of ["corner", "side"]) { const n = nearestOn(AREAS[name], x, y); if (n && n.d < 14 && (!best || n.d < best.d)) best = { ...n, name }; }
    if (best) AREAS[best.name].splice(best.i + 1, 0, [best.x, best.y]);
  }
  redrawPlates();
});

function open(k) {
  state.open = state.open === k || k === "none" ? "none" : k;
  render();
}
for (const b of document.querySelectorAll("[data-open]")) b.addEventListener("click", () => open(b.dataset.open));
for (const id of ["log", "status", "hp", "marks"]) $(`opt-${id}`).addEventListener("input", render);
addEventListener("keydown", (e) => {
  if (e.target.closest?.("select")) return;
  const k = e.key.toLowerCase();
  if (k === "escape") open("none");
  else if (OPEN_NAMES[k]) { e.preventDefault(); open(k); }
});
$("desk").addEventListener("click", () => $("desk").focus());

// Each screen is drawn at its real size and scaled to fit its frame.
const fit = () => {
  for (const [id, w] of [["desk", 1280], ["phone", 390]]) {
    const el = $(id);
    el.style.transform = `scale(${el.parentElement.clientWidth / w})`;
  }
};
new ResizeObserver(fit).observe(document.body);
render();
fit();
document.fonts.ready.then(render);
</script>
</body>
</html>
