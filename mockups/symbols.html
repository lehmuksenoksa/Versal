<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonfire Flames</title>
<style>
  /* Layout: two wrapping grids of animated cards, bonfires then torches. */
  :root {
    --desk: #e6dfcf;
    --paper: #f7f2e6;
    --ink: #1b1815;
    --muted: #6b5f52;
    --rule: #cfc5b0;
    --accent: #8c2b1c;
    --body: Georgia, "Iowan Old Style", "Times New Roman", serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--desk);
    color: var(--ink);
    font: 15px/1.45 var(--body);
    padding-block: 20px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1 { margin: 0 0 4px; font-size: 26px; font-weight: normal; }
  h2 { margin: 22px 0 8px; font-size: 19px; font-weight: normal; color: var(--muted); }
  header p { margin: 0 0 12px; max-width: 75ch; color: var(--muted); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 14px; color: var(--muted); }
  .bar label { display: flex; align-items: center; gap: 6px; }
  input[type="range"] { width: 130px; accent-color: var(--accent); }
  .grid { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
  figure { margin: 0; background: var(--paper); border: 1px solid var(--rule); padding: 8px; max-width: 100%; }
  .pair { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  canvas { display: block; }
  figcaption { padding: 6px 2px 0; max-width: 360px; }
  figcaption b { font-weight: normal; font-size: 17px; margin-right: 6px; }
  figcaption span { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Bonfire flames</h1>
  <p>Each card shows the symbol at game size (the default zoom) and close up, lit by its own light in the game's bands. On the S2 stones: the big bonfire's flame, and flames made of fire icons dancing.</p>
  <div class="bar">
    <label><input id="light" type="checkbox" checked> Light bands</label>
    <label>Speed <input id="speed" type="range" min="0" max="2" step="0.1" value="1"></label>
    <label>Close-up <input id="big" type="range" min="40" max="120" step="8" value="80"></label>
  </div>
</header>

<div class="grid" id="fires"></div>

<script type="module">
import { pen, PAPER, INK, wallLine } from "../js/maprender.js";
import { RNG } from "../js/rng.js";

const GAME_TS = 40 * 0.48, OUT = 2.9, IN = 1.9;
const FIRE = "#e8892f", FIRE_IN = "#f8d36a", EMBER = "#c2461f";
const DARK = [59, 57, 54], PAPER_RGB = [247, 242, 230];
const dpr = Math.min(2, window.devicePixelRatio || 1);
const $ = (id) => document.getElementById(id);

// ---- Flames ----------------------------------------------------------------

// A tongue of flame standing on (bx, by), `w` wide, `h` tall, its tip leaning
// `lean`; its sides a little off by `jit` (for a boiling line).
function tongue(g, bx, by, w, h, lean, jit = () => 0) {
  const tx = bx + lean + jit(), ty = by - h + jit();
  g.beginPath();
  g.moveTo(tx, ty);
  g.bezierCurveTo(bx + lean * 0.4 - w * 0.12 + jit(), by - h * 0.5, bx - w / 2 + jit(), by - h * 0.25, bx - w / 2, by);
  g.bezierCurveTo(bx - w / 2, by + w * 0.55, bx + w / 2, by + w * 0.55, bx + w / 2, by);
  g.bezierCurveTo(bx + w / 2 + jit(), by - h * 0.25, bx + lean * 0.4 + w * 0.12 + jit(), by - h * 0.5, tx, ty);
  g.closePath();
}

// How a tongue moves: its height and lean at time t.
const sway = (t, f) => ({
  h: 0.82 + 0.13 * Math.sin(t * f.sp + f.ph) + 0.07 * Math.sin(t * f.sp * 2.3 + f.ph * 1.7),
  lean: 0.35 * Math.sin(t * f.sp * 0.6 + f.ph) + 0.15 * Math.sin(t * f.sp * 1.9 + f.ph * 0.5),
});

// A fire of tongues rising from (x, y): `look` "colour" (warm, ink outlined),
// "ink" (solid ink, a paper heart) or "line" (paper, ink outlined). `boil`
// redraws the lines a little differently a few times a second, as on twos.
function rising(g, x, y, TS, t, { n = 3, w = 0.22, h = 0.55, look = "colour", boil = false, spread = 0.12 } = {}) {
  const k = TS / 32, tick = Math.floor(t * 8);
  const rng = new RNG(boil ? 977 + (tick % 3) * 131 : 977), jit = boil ? () => rng.range(-0.6, 0.6) * k : () => 0;
  const order = [...Array(n).keys()].sort((a, b) => Math.abs(b - (n - 1) / 2) - Math.abs(a - (n - 1) / 2));
  for (const i of order) {
    const mid = 1 - Math.abs(i - (n - 1) / 2) / n, f = { sp: 5 + i * 1.3, ph: i * 2.1 };
    const s = sway(t, f), bx = x + (i - (n - 1) / 2) * spread * TS, tw = w * TS * (0.7 + 0.3 * mid), th = h * TS * mid * s.h;
    tongue(g, bx, y, tw, th, s.lean * tw, jit);
    g.fillStyle = look === "colour" ? FIRE : look === "ink" ? INK : PAPER;
    g.fill();
    if (look !== "ink") { g.lineWidth = 1.5 * k; g.strokeStyle = INK; g.stroke(); }
    tongue(g, bx + s.lean * tw * 0.2, y, tw * 0.45, th * 0.5, s.lean * tw * 0.3, jit);
    g.fillStyle = look === "colour" ? FIRE_IN : look === "ink" ? PAPER : PAPER;
    if (look !== "line") g.fill();
    else { g.lineWidth = 1.1 * k; g.stroke(); }
  }
}

// Tongues pointing out every way from (x, y), as a fire seen from above.
function radiating(g, x, y, TS, t, { n = 7, r0 = 0.05, h = 0.26, w = 0.14, look = "colour" } = {}) {
  const k = TS / 32;
  for (let i = 0; i < n; i++) {
    const a = (i * 2 * Math.PI) / n + 0.3, f = { sp: 6 + (i % 3) * 1.4, ph: i * 1.9 }, s = sway(t, f);
    g.save();
    g.translate(x, y);
    g.rotate(a + Math.PI / 2);
    tongue(g, 0, -r0 * TS, w * TS, h * TS * s.h, s.lean * w * TS * 0.6);
    g.fillStyle = look === "colour" ? FIRE : INK;
    g.fill();
    if (look === "colour") { g.lineWidth = 1.3 * k; g.strokeStyle = INK; g.stroke(); }
    g.restore();
  }
  g.beginPath();
  g.arc(x, y, (r0 + 0.07) * TS, 0, 2 * Math.PI);
  g.fillStyle = look === "colour" ? FIRE_IN : PAPER;
  g.fill();
}

// Short ink rays round (x, y), growing and shrinking: the old burst, moving.
function rays(g, x, y, TS, t, { n = 9, r0 = 0.06, r1 = 0.24, width = 1.9, from = 0, span = 2 * Math.PI } = {}) {
  const k = TS / 32;
  g.lineCap = "round";
  g.strokeStyle = INK;
  g.lineWidth = width * k;
  for (let i = 0; i < n; i++) {
    const a = from + (span === 2 * Math.PI ? (i * span) / n : (i - (n - 1) / 2) * (span / (n - 1)));
    const L = r1 * (0.7 + 0.2 * Math.sin(t * (7 + (i % 4)) + i * 2.3) + 0.1 * Math.sin(t * 13 + i));
    g.beginPath();
    g.moveTo(x + Math.cos(a) * r0 * TS, y + Math.sin(a) * r0 * TS);
    g.lineTo(x + Math.cos(a) * L * TS, y + Math.sin(a) * L * TS);
    g.stroke();
  }
}

// Sparks drifting up from (x, y) and dying away.
function sparks(g, x, y, TS, t, { n = 6, rise = 1.1, spread = 0.25 } = {}) {
  for (let i = 0; i < n; i++) {
    const p = (t * 0.7 + i / n) % 1, cycle = Math.floor(t * 0.7 + i / n);
    const sx = x + (Math.sin(i * 12.9 + cycle * 7.3) * spread + Math.sin(p * 6 + i) * 0.06) * TS, sy = y - p * rise * TS;
    g.fillStyle = `rgba(${p < 0.5 ? "214, 110, 40" : "27, 24, 21"}, ${(1 - p) * 0.9})`;
    g.fillRect(sx - TS * 0.025, sy - TS * 0.025, TS * 0.05, TS * 0.05);
  }
}

// Embers in a bed, glowing in turn.
function embers(g, pts, TS, t) {
  pts.forEach(([x, y, r], i) => {
    const glow = 0.5 + 0.5 * Math.sin(t * (2 + (i % 3)) + i * 1.7);
    g.beginPath();
    g.arc(x, y, r * TS, 0, 2 * Math.PI);
    g.fillStyle = `rgb(${Math.round(120 + 110 * glow)}, ${Math.round(40 + 90 * glow)}, ${Math.round(20 + 20 * glow)})`;
    g.fill();
    g.lineWidth = TS / 32;
    g.strokeStyle = INK;
    g.stroke();
  });
}

// ---- What lies under the flame (drawn once) --------------------------------

// Stones round (x, y), touching: sizes picked at random, then all scaled a
// little so the ring closes with no gap. Each [cx, cy, r, a] (a: its angle).
function ring(rng, x, y, TS, { R = 0.42, min = 0.07, max = 0.14, squeeze = 0.9 } = {}) {
  const rs = [], target = 2 * Math.PI * R * TS;
  let len = 0;
  while (len < target) {
    const r = TS * rng.range(min, max);
    len += (rs.length ? rs.at(-1) : 0) + r;
    rs.push(r);
  }
  // (Closing: the last stone touches the first.)
  const out = [];
  let a = rng.range(0, 2 * Math.PI);
  const sum = rs.reduce((t, r, i) => t + r + rs[(i + 1) % rs.length], 0), f = target / sum;
  rs.forEach((r, i) => {
    const rr = r * f / squeeze, rad = R * TS + rng.range(-0.02, 0.02) * TS;
    out.push([x + Math.cos(a) * rad, y + Math.sin(a) * rad, rr, a]);
    a += (r * f + rs[(i + 1) % rs.length] * f) / (R * TS);
  });
  return out;
}

// A lumpy stone about (cx, cy), as the map's rubble, stretched `along` the
// ring by `stretch`.
function pebble(g, rng, cx, cy, r, along = 0, stretch = 1) {
  const m = rng.int(6, 8), a0 = rng.range(0, Math.PI * 2), c = Math.cos(along), s = Math.sin(along);
  g.beginPath();
  for (let i = 0; i < m; i++) {
    const a = a0 + (i / m) * Math.PI * 2 + rng.range(-0.25, 0.25), rr = r * rng.range(0.8, 1.12);
    const u = Math.cos(a) * rr * stretch, v = Math.sin(a) * rr / Math.sqrt(stretch);
    g[i ? "lineTo" : "moveTo"](cx + u * c - v * s, cy + u * s + v * c);
  }
  g.closePath();
}
function lumps(g, rng, stones, TS, { stretch = 1, width = 2.7 } = {}) {
  g.lineJoin = "round";
  g.lineWidth = width * TS / 32;
  g.strokeStyle = INK;
  for (const [cx, cy, r, a] of stones) {
    pebble(g, rng, cx, cy, r, a + Math.PI / 2, stretch);
    g.fillStyle = PAPER;
    g.fill();
    g.stroke();
  }
}

// The big fire's heap of logs.
function heap(P, rng, x, y, TS) {
  for (const a of [0.2, 1.3, 2.4, 3.5, 4.6, 5.6]) {
    const c = Math.cos(a), s = Math.sin(a), cx = x + c * 0.12 * TS, cy = y + s * 0.12 * TS;
    P.box(cx, cy, 0.42 * TS, 0.11 * TS, a, IN + 0.4, PAPER);
    P.round(cx + c * 0.21 * TS, cy + s * 0.21 * TS, 0.05 * TS, 1.2);
  }
}
const bigFlame = (g, x, y, TS, t) => { rising(g, x, y + TS * 0.18, TS, t, { n: 5, w: 0.2, h: 0.8, spread: 0.11 }); sparks(g, x, y - TS * 0.4, TS, t, { n: 8, rise: 1.4 }); };

// A flame like a drawn fire icon, standing on (x, y): a round bulb `b`
// across, its main tip `h` up leaning `lean`, a second tongue `h2` up on
// one `side`, a notch between; a paper tongue cut out of the bulb. (In
// squares; `jit` puts the hand off a little.)
function icon(g, x, y, TS, p, { fill = INK, heart = PAPER, outline = 0, jit = () => 0 } = {}) {
  const S = p.side, b = p.b * TS, h = p.h * TS, h2 = p.h2 * TS, L = p.lean * TS, K = 0.5523 * b;
  const X = (u) => x + u * S, Y = (v) => y - b + v;
  const pt = (u, v) => [X(u) + jit(), Y(v) + jit()];
  g.beginPath();
  g.moveTo(...pt(L * S, -h));
  // (Down the plain side to the bulb, round its bottom, up the tongue's side.)
  g.bezierCurveTo(...pt(-L * S * 0.4 - b * 0.1, -h * 0.66), ...pt(-b * 1.05, -h * 0.38), X(-b), Y(0));
  g.bezierCurveTo(X(-b), Y(K), X(-K), Y(b), X(0), Y(b));
  g.bezierCurveTo(X(K), Y(b), X(b), Y(K), X(b), Y(0));
  g.bezierCurveTo(...pt(b * 1.08, -b * 0.5), ...pt(b * 1.0 + p.l2 * TS * 0.5, -h2 * 0.65), ...pt(b * 0.78 + p.l2 * TS, -h2));
  g.bezierCurveTo(...pt(b * 0.6, -h2 * 0.7), ...pt(b * 0.32, -h * 0.32), ...pt(b * 0.28, -h * 0.4));
  g.bezierCurveTo(...pt(b * 0.25, -h * 0.6), ...pt(-L * S * 0.2 + b * 0.25, -h * 0.85), ...pt(L * S, -h));
  g.closePath();
  // (A paper edge round it, so it reads against the stones and logs.)
  if (!outline) { g.lineWidth = 3 * TS / 32; g.strokeStyle = PAPER; g.lineJoin = "round"; g.stroke(); }
  g.fillStyle = fill;
  g.fill();
  if (outline) { g.lineWidth = outline * TS / 32; g.strokeStyle = INK; g.lineJoin = "round"; g.stroke(); }
  // The heart: a tongue rising inside the bulb from near its bottom.
  if (p.ih > 0) {
    tongue(g, X(p.ix * TS), Y(b * 0.72), b * 0.85, p.ih * TS, p.il * TS * S, jit);
    g.fillStyle = heart;
    g.fill();
  }
}

// How an icon flame dances at time t: its tips sway and reach, the bulb
// breathes, the heart flickers. `f`: its own speed and phase.
function dance(t, f, size = 1) {
  const w = (m, o = 0) => Math.sin(t * f.sp * m + f.ph + o);
  return {
    side: f.side ?? 1,
    b: size * (0.25 + 0.012 * w(1.7)),
    h: size * (0.9 + 0.11 * w(1) + 0.05 * w(2.6, 1)),
    lean: size * (0.1 + 0.07 * w(0.55) + 0.03 * w(1.9, 2)),
    h2: size * (0.5 + 0.08 * w(1.3, 2) + 0.04 * w(3.1)),
    l2: size * (0.05 * w(0.8, 1)),
    ih: size * (0.24 + 0.07 * w(2.2, 3)),
    ix: size * 0.02 * w(0.9, 4),
    il: size * 0.05 * w(1.4, 5),
  };
}

// A few icon flames together, back to front: [dx, size, side, speed, phase].
function dancers(g, x, y, TS, t, set, o = {}) {
  for (const [dx, size, side, sp, ph, dy = 0] of set) icon(g, x + dx * TS, y + dy * TS, TS, dance(t, { sp, ph, side }, size), o);
}

// Each tick a new drawing, as a hand-animated fire on twos: the dance at
// random moments, the lines a little off.
function onTwos(g, x, y, TS, t, set, o = {}) {
  const tick = Math.floor(t * 8), rng = new RNG(31 + tick * 7);
  const jit = () => rng.range(-0.5, 0.5) * TS / 32;
  for (const [dx, size, side, sp, ph, dy = 0] of set) icon(g, x + dx * TS, y + dy * TS, TS, dance(rng.range(0, 60), { sp, ph, side }, size), { ...o, jit });
}

const S2 = (P, rng, x, y, TS, g) => { lumps(g, rng, ring(rng, x, y, TS), TS); heap(P, rng, x, y, TS); };
const TRIO = [[-0.14, 0.62, -1, 4.3, 1.1, -0.02], [0.15, 0.68, 1, 3.7, 2.6, -0.02], [0, 1, 1, 3.1, 0]];

const FIRES = [
  { id: "F", name: "Big bonfire (as before)", note: "For comparison: the warm tongues you picked, on the S2 stones.", flame: bigFlame },
  { id: "D1", name: "One icon, dancing", note: "A single inked fire icon: its tips sway and reach, the bulb breathes, the paper heart flickers.",
    flame: (g, x, y, TS, t) => dancers(g, x, y + TS * 0.16, TS, t, [[0, 1.05, 1, 3.1, 0]]) },
  { id: "D2", name: "Three icons, dancing", note: "A big icon with two smaller ones behind it, leaning out, each dancing to its own beat.",
    flame: (g, x, y, TS, t) => dancers(g, x, y + TS * 0.16, TS, t, TRIO) },
  { id: "D3", name: "Three icons, on twos", note: "The same three, but redrawn eight times a second, each drawing a little different, like a hand-animated cartoon.",
    flame: (g, x, y, TS, t) => onTwos(g, x, y + TS * 0.16, TS, t, TRIO) },
  { id: "D4", name: "Three icons, warm", note: "D2 in fire colours with an ink outline and a yellow heart, like the big bonfire.",
    flame: (g, x, y, TS, t) => dancers(g, x, y + TS * 0.16, TS, t, TRIO, { fill: FIRE, heart: FIRE_IN, outline: 1.6 }) },
  { id: "D5", name: "Ring of small icons", note: "Five small icons dancing round the heap, with sparks: a wider, busier fire.",
    flame: (g, x, y, TS, t) => { dancers(g, x, y + TS * 0.16, TS, t, [[-0.17, 0.5, -1, 4.6, 0.4, -0.06], [0.17, 0.5, 1, 4.1, 1.9, -0.06], [-0.09, 0.62, -1, 3.6, 3.1], [0.1, 0.62, 1, 3.3, 4.4], [0, 0.8, 1, 2.9, 5.2, 0.03]]); sparks(g, x, y - TS * 0.4, TS, t, { n: 6, rise: 1.3 }); } },
].map((v) => ({ ...v, base: S2 }));

const TORCHES = [];

// ---- Scenes ------------------------------------------------------------------

// (Game size: a wide patch, to see the bands; close up, just round the fire.)
const SIZES = { game: [9, 7], big: [5, 3] }, scenes = [];
let COLS = 9, ROWS = 7;

// The paper, a loose grid, and (for a torch) a wall with rock above it.
function backdrop(g, TS, rng, wallY) {
  const k = TS / 32;
  g.fillStyle = PAPER;
  g.fillRect(0, 0, COLS * TS, ROWS * TS);
  g.strokeStyle = "rgba(27, 24, 21, 0.28)";
  g.lineWidth = 0.9 * k;
  for (let i = 1; i < COLS; i++) { g.beginPath(); g.moveTo(i * TS + rng.range(-0.6, 0.6) * k, wallY ?? 0); g.lineTo(i * TS + rng.range(-0.6, 0.6) * k, ROWS * TS); g.stroke(); }
  for (let j = 1; j < ROWS; j++) { if (wallY != null && j * TS <= wallY) continue; g.beginPath(); g.moveTo(0, j * TS + rng.range(-0.6, 0.6) * k); g.lineTo(COLS * TS, j * TS + rng.range(-0.6, 0.6) * k); g.stroke(); }
  if (wallY != null) {
    g.fillStyle = PAPER;
    g.fillRect(0, 0, COLS * TS, wallY);
    // (Short strokes in threes, packed along the wall, as the map's hatching.)
    g.strokeStyle = INK;
    g.lineCap = "round";
    for (let cx = -TS * 0.1; cx < COLS * TS + TS * 0.3; cx += TS * rng.range(0.32, 0.42)) {
      const a = rng.range(0.4, 2.7), cy = wallY - TS * rng.range(0.2, 0.45), L = TS * rng.range(0.13, 0.18);
      for (let m = -1; m <= 1; m++) {
        const ox = Math.cos(a + Math.PI / 2) * m * TS * 0.09, oy = Math.sin(a + Math.PI / 2) * m * TS * 0.09;
        g.lineWidth = 1.5 * k;
        g.beginPath(); g.moveTo(cx + ox - Math.cos(a) * L, cy + oy - Math.sin(a) * L); g.lineTo(cx + ox + Math.cos(a) * L, cy + oy + Math.sin(a) * L); g.stroke();
      }
    }
    g.fillStyle = INK;
    g.strokeStyle = INK;
    for (let i = -1; i <= COLS; i++) wallLine(g, [i * TS, wallY], [(i + 1) * TS, wallY], TS, rng);
  }
}

function makeScene(host, v, torch) {
  const fig = document.createElement("figure"), pair = document.createElement("div");
  pair.className = "pair";
  const views = [GAME_TS, 0].map((ts) => { const c = document.createElement("canvas"); pair.append(c); return { c, ts, big: !ts }; });
  fig.append(pair);
  const cap = document.createElement("figcaption");
  cap.innerHTML = `<b>${v.id}</b>${v.name}<br><span>${v.note}</span>`;
  fig.append(cap);
  host.append(fig);
  scenes.push({ v, torch, views });
}

function build(view, v, torch) {
  [COLS, ROWS] = view.big ? SIZES.big : SIZES.game;
  const TS = view.big ? +$("big").value : GAME_TS, W = COLS * TS, H = ROWS * TS;
  view.TS = TS;
  view.c.width = Math.round(W * dpr);
  view.c.height = Math.round(H * dpr);
  view.c.style.width = `${W}px`;
  view.c.style.height = `${H}px`;
  const base = (view.base = document.createElement("canvas"));
  base.width = view.c.width;
  base.height = view.c.height;
  const g = base.getContext("2d");
  g.scale(dpr, dpr);
  const rng = new RNG(4242 + v.id.charCodeAt(v.id.length - 1));
  const wy = torch ? TS * (view.big ? 0.7 : 2.3) : null;
  backdrop(g, TS, rng, wy);
  const P = pen(g, rng, TS / 32);
  g.strokeStyle = INK;
  g.lineCap = "round";
  const x = (Math.floor(COLS / 2) + 0.5) * TS, y = torch ? wy : (Math.floor(ROWS / 2) + 0.5) * TS;
  v.base(P, rng, x, y, TS, g);
  // (Where the light comes from, and where the flame goes.)
  view.at = { x, y, lx: x, ly: torch ? wy + TS * v.at : y };
}

// The light's bands over what lies round it: full, dim, dark, then unseen.
function light(g, TS, lx, ly, t, torch, wy) {
  const B = torch ? { full: 1.5, dim: 1, dark: 1.5 } : { full: 2.5, dim: 1.5, dark: 2 };
  const flick = 1 + 0.02 * Math.sin(t * 9) + 0.015 * Math.sin(t * 23);
  const mix = (a) => `rgb(${DARK.map((d, i) => Math.round(d + (PAPER_RGB[i] - d) * a)).join(",")})`;
  g.save();
  g.globalCompositeOperation = "multiply";
  g.fillStyle = mix(0);
  g.fillRect(0, 0, COLS * TS, ROWS * TS);
  g.globalCompositeOperation = "source-over";
  const bands = [[B.full + B.dim + B.dark, 0.2], [B.full + B.dim, 0.75], [B.full, 1]];
  // (Each band drawn as a ragged ring: the map shows through, toned.)
  for (const [r, a] of bands) {
    g.save();
    // (A torch's light stops at its wall, lighting a thin rim of the rock.)
    if (torch) { g.beginPath(); g.rect(0, wy - TS * 0.3, COLS * TS, ROWS * TS); g.clip(); }
    g.beginPath();
    for (let i = 0; i <= 48; i++) {
      const ang = (i / 48) * 2 * Math.PI, rr = r * TS * flick * (1 + 0.03 * Math.sin(ang * 7 + r) + 0.02 * Math.sin(ang * 13));
      g[i ? "lineTo" : "moveTo"](lx + Math.cos(ang) * rr, ly + Math.sin(ang) * rr);
    }
    g.clip();
    g.drawImage(g.__base, 0, 0, COLS * TS, ROWS * TS);
    g.globalCompositeOperation = "multiply";
    g.fillStyle = a === 1 ? "rgba(255, 196, 120, 0.25)" : mix(a);
    g.fillRect(0, 0, COLS * TS, ROWS * TS);
    g.restore();
  }
  g.restore();
}

function frame(now) {
  const t = (now / 1000) * +$("speed").value + 10;
  for (const s of scenes)
    for (const view of s.views) {
      [COLS, ROWS] = view.big ? SIZES.big : SIZES.game;
      const g = view.c.getContext("2d"), TS = view.TS, { x, y, lx, ly } = view.at;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.drawImage(view.base, 0, 0, COLS * TS, ROWS * TS);
      g.__base = view.base;
      if ($("light").checked) light(g, TS, lx, ly, t, s.torch, y);
      if (s.v.embers) embers(g, s.v.embers(0, 0).map(([a, b, r]) => [x + a * TS, y + b * TS, r]), TS, t);
      s.v.flame(g, x, y, TS, t);
    }
  requestAnimationFrame(frame);
}

FIRES.forEach((v) => makeScene($("fires"), v, false));
const rebuild = () => scenes.forEach((s) => s.views.forEach((view) => build(view, s.v, s.torch)));
$("big").addEventListener("input", rebuild);
rebuild();
requestAnimationFrame(frame);
</script>
</body>
</html>
