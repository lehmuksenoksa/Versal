<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sight and Light</title>
<style>
  /* Layout: the game fills the left; a panel of options sits on the right
     (below the game on narrow screens). */
  @font-face { font-family: "Texturina"; font-weight: 100 900; src: url("../fonts/Texturina-Latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; font-display: block; }
  @font-face { font-family: "Texturina"; font-weight: 100 900; src: url("../fonts/Texturina-LatinExt.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; font-display: block; }
  @font-face { font-family: "IM Fell English"; font-style: italic; src: url("../fonts/IMFellEnglish-Italic.woff2") format("woff2"); }
  :root {
    --desk: #2b221c;
    --paper: #f7f2e6;
    --ink: #1b1815;
    --muted: #6b5f52;
    --rule: #cfc5b0;
    --accent: #8c2b1c;
    --body: Georgia, "Iowan Old Style", "Times New Roman", serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--desk); color: var(--ink); font: 14px/1.4 var(--body); display: grid; grid-template-columns: minmax(0, 1fr) 320px; overflow: hidden; }
  [hidden] { display: none !important; }
  #view { display: block; width: 100%; height: 100%; touch-action: manipulation; }
  aside {
    overflow-y: auto; background: var(--paper); border-left: 1px solid var(--rule);
    padding-block: 14px 24px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 12px;
  }
  h1 { margin: 0; font-size: 22px; font-weight: normal; }
  aside > p { margin: 0; color: var(--muted); font-size: 13px; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: 14px var(--body); padding: 5px 12px; cursor: pointer; color: var(--paper); background: var(--accent); border: 1px solid var(--ink); border-radius: 2px; }
  button.plain { color: var(--ink); background: #fffdf7; }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  fieldset { border: 1px solid var(--rule); padding: 8px 10px 10px; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  legend { font-size: 15px; padding: 0 4px; }
  label { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); }
  output { color: var(--ink); font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  select { font: 14px var(--body); padding: 3px 4px; border: 1px solid var(--rule); background: #fffdf7; color: var(--ink); }
  textarea { width: 100%; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--rule); background: #fffdf7; padding: 6px; }
  @media (max-width: 760px) {
    body { grid-template-columns: minmax(0, 1fr); grid-template-rows: 60vh auto; overflow: auto; }
    aside { border-left: 0; border-top: 1px solid var(--rule); overflow: visible; }
  }
</style>
</head>
<body>
<canvas id="view" aria-label="Dungeon map"></canvas>
<aside>
  <h1>Sight and light</h1>
  <p>Walk with the arrow keys, numpad, <kbd>hjklyubn</kbd> or <kbd>wasd</kbd>, or click toward a spot; <kbd>.</kbd> waits a turn. Zoom with the mouse wheel or <kbd>+</kbd> and <kbd>&minus;</kbd>, <kbd>0</kbd> to reset. Changes apply at once.</p>
  <div class="buttons">
    <button id="copy" type="button">Copy settings</button>
    <button id="newmap" class="plain" type="button">New map</button>
    <button id="reset" class="plain" type="button">Defaults</button>
  </div>
  <div id="export-box" hidden>
    <label for="export">Settings, ready to paste <span id="copy-status"></span></label>
    <textarea id="export" readonly rows="3"></textarea>
  </div>

  <fieldset>
    <legend>View</legend>
    <label for="camera">Camera <select id="camera"><option value="fixed">Fixed, whole map</option><option value="follow">Follows the player</option></select></label>
  </fieldset>

  <fieldset>
    <legend>Sight</legend>
    <label for="sight">How far the player sees <output id="sight-v"></output><input id="sight" type="range" min="3" max="16" step="1"></label>
    <label for="reveal">Time for new ground to ink in <output id="reveal-v"></output><input id="reveal" type="range" min="0" max="1.5" step="0.05"></label>
  </fieldset>

  <fieldset>
    <legend>Unknown ground</legend>
    <label for="unknown">Hidden by <select id="unknown"><option value="paper">Blank paper</option><option value="dark">Darkness</option></select></label>
    <label for="edge">Edge of what's known <select id="edge"><option value="soft">Soft</option><option value="ragged">Ragged, inked</option><option value="tiles">Square tiles</option></select></label>
    <label for="softness">Edge width <output id="softness-v"></output><input id="softness" type="range" min="0" max="2" step="0.05"></label>
  </fieldset>

  <fieldset>
    <legend>Remembered, out of sight</legend>
    <label for="memory">Drawn as <select id="memory"><option value="pencil">Pencil grey</option><option value="faded">Faded ink</option><option value="sepia">Sepia</option><option value="unchanged">Unchanged</option></select></label>
    <label for="fade">Washed out by <output id="fade-v"></output><input id="fade" type="range" min="0" max="0.85" step="0.05"></label>
  </fieldset>

  <fieldset>
    <legend>Light</legend>
    <label for="light">Light <select id="light"><option value="candle">Candle carried by the player</option><option value="none">None</option></select></label>
    <label for="radius">Light radius <output id="radius-v"></output><input id="radius" type="range" min="2" max="16" step="0.5"></label>
    <label for="dark">Darkness beyond the light <output id="dark-v"></output><input id="dark" type="range" min="0" max="0.9" step="0.05"></label>
    <label for="warmth">Warmth <output id="warmth-v"></output><input id="warmth" type="range" min="0" max="1" step="0.05"></label>
    <label for="flicker">Flicker <output id="flicker-v"></output><input id="flicker" type="range" min="0" max="1" step="0.05"></label>
    <label for="lightUnknown">Light falls on unexplored ground too <select id="lightUnknown"><option value="no">No</option><option value="yes">Yes</option></select></label>
  </fieldset>
</aside>

<script type="module">
import { World } from "../js/world.js";
import { Renderer, VIS_DEFAULTS, bindZoom } from "../js/render.js";

const KEYS = {
  ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
  k: [0, -1], j: [0, 1], h: [-1, 0], l: [1, 0], y: [-1, -1], u: [1, -1], b: [-1, 1], n: [1, 1],
  w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
  Numpad8: [0, -1], Numpad2: [0, 1], Numpad4: [-1, 0], Numpad6: [1, 0],
  Numpad7: [-1, -1], Numpad9: [1, -1], Numpad1: [-1, 1], Numpad3: [1, 1],
};
const $ = (id) => document.getElementById(id);
const canvas = $("view");
const renderer = new Renderer(canvas);
let world = null, lastMove = 0;

const fmt = {
  sight: (v) => `${v} tiles`, reveal: (v) => (+v ? `${v} s` : "instant"), softness: (v) => `${v} tiles`,
  fade: (v) => `${Math.round(v * 100)}%`, radius: (v) => `${v} tiles`, dark: (v) => `${Math.round(v * 100)}%`,
  warmth: (v) => `${Math.round(v * 100)}%`, flicker: (v) => `${Math.round(v * 100)}%`,
};
const keys = Object.keys(VIS_DEFAULTS);
function show(vis) {
  for (const k of keys) {
    $(k).value = vis[k];
    if (fmt[k]) $(k + "-v").textContent = fmt[k](vis[k]);
  }
}
function read() {
  const v = {};
  for (const k of keys) v[k] = $(k).type === "range" ? parseFloat($(k).value) : $(k).value;
  return v;
}
for (const k of keys) {
  const el = $(k);
  el.addEventListener("input", () => {
    const v = read();
    if (fmt[k]) $(k + "-v").textContent = fmt[k](v[k]);
    renderer.setVis(v);
  });
  // Hand the arrow keys back to the game once a control is set.
  el.addEventListener("change", () => el.blur());
}

// With a fixed camera the whole map fits the view and nothing scrolls.
function applyCamera() {
  renderer.follow = $("camera").value === "follow";
  renderer.cam.snap = true;
  if (world) renderer.setZoom(renderer.follow ? 0.75 : renderer.fitZoom(world.level));
}
$("camera").addEventListener("change", (e) => { applyCamera(); e.target.blur(); });

function newMap() {
  world = new World(undefined, { sight: renderer.vis.sight });
  renderer.follow = $("camera").value === "follow";
  if (!renderer.follow) renderer.zoom = renderer.fitZoom(world.level);
  renderer.setWorld(world);
}
$("newmap").addEventListener("click", newMap);
$("reset").addEventListener("click", () => { show(VIS_DEFAULTS); renderer.setVis({ ...VIS_DEFAULTS }); });
$("copy").addEventListener("click", () => {
  const text = JSON.stringify(read());
  const box = $("export"), status = $("copy-status");
  $("export-box").hidden = false;
  box.value = text;
  const fallback = () => { box.focus(); box.select(); status.textContent = "(selected: press Ctrl+C or Cmd+C to copy)"; };
  try { navigator.clipboard.writeText(text).then(() => (status.textContent = "(copied to the clipboard)"), fallback); } catch { fallback(); }
});

window.addEventListener("keydown", (e) => {
  if (!world || e.ctrlKey || e.metaKey || e.altKey) return;
  if (["INPUT", "SELECT", "TEXTAREA", "BUTTON"].includes(e.target.tagName)) return;
  const dir = KEYS[e.code] || KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  const now = performance.now();
  if (dir) {
    e.preventDefault();
    if (e.repeat && now - lastMove < 110) return;
    lastMove = now;
    world.playerMove(dir[0], dir[1]);
  } else if (e.key === "." || e.key === " ") {
    e.preventDefault();
    world.tick();
  }
});
canvas.addEventListener("click", (e) => {
  if (!world) return;
  const r = canvas.getBoundingClientRect();
  const t = renderer.screenToTile(e.clientX - r.left, e.clientY - r.top);
  const dx = Math.sign(t.x - world.player.x), dy = Math.sign(t.y - world.player.y);
  if (dx || dy) world.playerMove(dx, dy);
});
window.addEventListener("resize", () => { renderer.resize(); if (world && !renderer.follow) renderer.setZoom(renderer.fitZoom(world.level)); });
bindZoom(renderer, canvas);

function loop(now) {
  renderer.frame(now);
  requestAnimationFrame(loop);
}

show(VIS_DEFAULTS);
await document.fonts.load('800 48px "Texturina"', "@g").catch(() => {});
await document.fonts.load('600 48px "Texturina"', "@g").catch(() => {});
await document.fonts.load('italic 16px "IM Fell English"').catch(() => {});
renderer.resize();
newMap();
requestAnimationFrame(loop);
</script>
</body>
</html>
